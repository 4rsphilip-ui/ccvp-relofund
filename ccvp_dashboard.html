<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCVP Church Relocation Fund — Leadership Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #1e3d0f; --forest-mid: #2d5a18; --gold: #c9971a;
    --cream: #faf7f0; --parchment: #f2ead8; --ink: #1a1a14;
    --muted: #6b6652; --border: #d8cfb4; --error: #8b2020;
    --progress-bg: #e8f0e3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Jost', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; }
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #0d2006 0%, var(--forest) 60%, #1a3509 100%); }
  .login-card { background: var(--cream); border: 1px solid var(--border); border-radius: 3px; padding: 48px 40px; width: 380px; text-align: center; box-shadow: 0 24px 80px rgba(0,0,0,0.5); }
  .login-card .cross { font-size: 30px; color: var(--gold); margin-bottom: 8px; letter-spacing: 6px; }
  .login-card h1 { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: var(--forest); margin-bottom: 4px; }
  .login-card .sub { font-size: 11px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 30px; }
  .login-card input { width: 100%; padding: 12px 14px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 2px; font-family: 'Jost', sans-serif; font-size: 15px; color: var(--ink); }
  .login-card input:focus { outline: 2px solid var(--forest-mid); border-color: transparent; }
  .btn-login { width: 100%; padding: 13px; background: var(--forest); color: white; border: none; border-radius: 2px; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; transition: background 0.2s; }
  .btn-login:hover { background: var(--forest-mid); }
  .login-err { color: var(--error); font-size: 13px; margin-top: 10px; display: none; }
  #app { display: none; }
  header { background: var(--forest); padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--gold); }
  .hdr-left h1 { font-family: 'Cormorant Garamond', serif; color: white; font-size: 20px; font-weight: 600; }
  .hdr-left span { color: rgba(255,255,255,0.5); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
  .btn-logout { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 7px 16px; border-radius: 2px; cursor: pointer; font-size: 11px; font-family: 'Jost', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; transition: background 0.2s; }
  .btn-logout:hover { background: rgba(255,255,255,0.2); }
  .main { max-width: 1140px; margin: 0 auto; padding: 28px 20px 48px; }
  .goal-banner { background: white; border: 1px solid var(--border); border-radius: 3px; padding: 22px 26px; margin-bottom: 24px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .goal-input-group { display: flex; align-items: center; gap: 10px; }
  .goal-input-group label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); white-space: nowrap; }
  .amt-wrap { position: relative; }
  .amt-wrap .currency { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
  .amt-wrap input { padding: 9px 12px 9px 26px; border: 1px solid var(--border); border-radius: 2px; font-family: 'Jost', sans-serif; font-size: 15px; width: 160px; color: var(--ink); }
  .amt-wrap input:focus { outline: 2px solid var(--forest-mid); border-color: transparent; }
  .btn-set-goal { padding: 9px 18px; background: var(--forest); color: white; border: none; border-radius: 2px; cursor: pointer; font-family: 'Jost', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; transition: background 0.2s; }
  .btn-set-goal:hover { background: var(--forest-mid); }
  .goal-stats { display: flex; gap: 28px; flex-wrap: wrap; flex: 1; justify-content: flex-end; }
  .goal-stat { text-align: right; }
  .goal-stat .gs-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2px; }
  .goal-stat .gs-val { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 700; }
  .goal-stat .gs-val.balance { color: var(--forest); }
  .goal-stat .gs-val.pct { color: var(--gold); }
  .progress-wrap { margin-bottom: 24px; }
  .progress-bar-bg { height: 12px; background: var(--progress-bg); border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .progress-bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--forest-mid), var(--forest)); transition: width 0.6s ease; }
  .progress-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 5px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 14px; margin-bottom: 24px; }
